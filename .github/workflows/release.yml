name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Verify (check · unit · build · e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check & lint
        run: pnpm check

      - name: Unit tests (with coverage report)
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e suite against production build
        run: pnpm exec playwright test --config=playwright.pwa.config.ts
        timeout-minutes: 20

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            coverage/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Build & push multi-arch image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mansyar/marblescape:${{ github.ref_name }}
            ghcr.io/mansyar/marblescape:latest

  deploy:
    name: Deploy to Coolify
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Coolify webhook
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"${{ github.ref_name }}","image":"ghcr.io/mansyar/marblescape:${{ github.ref_name }}"}' \
            "${{ secrets.COOLIFY_WEBHOOK_URL }}"

  release:
    name: Create GitHub Release
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: Marble Scape ${{ github.ref_name }}
          body: "Automated release for ${{ github.ref_name }}.\n\nImage: `ghcr.io/mansyar/marblescape:${{ github.ref_name }}` (multi-arch amd64/arm64)."