server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any non-file route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PWA assets: correct MIME types (manifest + service worker)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Service worker: JS MIME type and never cached by browsers
    location = /sw.js {
        types { text/javascript js; }
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Long-lived caching for hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml application/wasm;
    gzip_min_length 1024;
}
